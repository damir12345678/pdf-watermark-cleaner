<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Удаление водяных знаков PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 520px;
      text-align: center;
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 24px;
    }

    .dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 36px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #f1f5f9;
      margin-bottom: 20px;
    }

    .dropzone.dragover {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .dropzone svg {
      width: 48px;
      height: 48px;
      color: var(--primary);
      margin-bottom: 12px;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s ease;
      display: none;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .status {
      margin-top: 16px;
      font-size: 0.9rem;
      font-weight: 500;
      word-break: break-word;
    }

    .status.success { color: #16a34a; }
    .status.error { color: #dc2626; }
    .status.loading { color: var(--primary); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Удаление водяных знаков PDF</h1>
    <p>Безопасная очистка фоновых меток отчета HVPQ</p>

    <div class="dropzone" id="dropzone">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
      </svg>
      <div id="dropzone-text"><strong>Выберите файл</strong> или перетащите его сюда</div>
      <input type="file" id="fileInput" accept="application/pdf">
    </div>

    <button id="processBtn" class="btn">Очистить и скачать</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const status = document.getElementById('status');
    const dropzoneText = document.getElementById('dropzone-text');

    let selectedFile = null;

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) handleFileSelection(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFileSelection(e.target.files[0]);
    });

    function handleFileSelection(file) {
      if (!file.name.toLowerCase().endsWith('.pdf')) {
        status.textContent = 'Пожалуйста, выберите PDF-файл.';
        status.className = 'status error';
        return;
      }
      selectedFile = file;
      dropzoneText.innerHTML = `Выбран файл: <strong>${file.name}</strong>`;
      processBtn.style.display = 'block';
      status.textContent = '';
    }

    processBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      status.textContent = 'Точечная нейтрализация водяных знаков...';
      status.className = 'status loading';
      processBtn.disabled = true;

      try {
        const fileBuffer = await selectedFile.arrayBuffer();
        const pdfDoc = await PDFLib.PDFDocument.load(fileBuffer);
        const context = pdfDoc.context;

        // 1. Собираем уникальные изображения, используемые на 1-й странице (логотип OCIMF)
        const firstPage = pdfDoc.getPage(0);
        const firstPageImages = new Set();
        const firstResRef = firstPage.node.get(PDFLib.PDFName.of('Resources'));
        const firstRes = firstResRef ? context.lookup(firstResRef) : null;
        
        if (firstRes instanceof PDFLib.PDFDict) {
          const firstXObjRef = firstRes.get(PDFLib.PDFName.of('XObject'));
          const firstXObj = firstXObjRef ? context.lookup(firstXObjRef) : null;
          if (firstXObj instanceof PDFLib.PDFDict) {
            firstXObj.entries().forEach(([key, ref]) => {
              firstPageImages.add(ref);
            });
          }
        }

        // 2. Сканируем все косвенные объекты документа
        const enumeratedEntries = context.enumerateIndirectObjects();

        for (const [ref, obj] of enumeratedEntries) {
          if (obj instanceof PDFLib.PDFStream) {
            const subtype = obj.dict.get(PDFLib.PDFName.of('Subtype'));

            if (subtype && subtype.toString() === '/Image') {
              // Если это логотип первой страницы — пропускаем его
              if (firstPageImages.has(ref)) {
                continue;
              }

              const width = obj.dict.get(PDFLib.PDFName.of('Width'))?.value || 0;
              const height = obj.dict.get(PDFLib.PDFName.of('Height'))?.value || 0;

              // Защищаем векторные/битовые схемы танков и палуб (широкие схемы)
              const isTechnicalDrawing = (width >= 500 && height >= 150);

              if (!isTechnicalDrawing) {
                // Превращаем сам объект водяного знака в полностью прозрачный 1x1 пиксель
                // Это удаляет водяной знак везде, не ломая поток команд страниц и структуру PDF
                obj.dict.set(PDFLib.PDFName.of('Width'), PDFLib.PDFNumber.of(1));
                obj.dict.set(PDFLib.PDFName.of('Height'), PDFLib.PDFNumber.of(1));
                obj.dict.set(PDFLib.PDFName.of('BitsPerComponent'), PDFLib.PDFNumber.of(8));
                obj.dict.set(PDFLib.PDFName.of('ColorSpace'), PDFLib.PDFName.of('DeviceGray'));
                obj.dict.delete(PDFLib.PDFName.of('SMask'));
                obj.dict.delete(PDFLib.PDFName.of('Mask'));
                obj.dict.delete(PDFLib.PDFName.of('Filter'));

                // Байт 255 = белый пиксель (или 0 = прозрачный в маске)
                obj.contents = new Uint8Array([255]);
              }
            }
          }
        }

        const modifiedBytes = await pdfDoc.save();
        const blob = new Blob([modifiedBytes], { type: 'application/pdf' });
        const downloadUrl = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = selectedFile.name.replace('.pdf', '_cleaned.pdf');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);

        status.textContent = 'Успешно! Все страницы, схемы и логотип сохранены без водяных знаков.';
        status.className = 'status success';
      } catch (err) {
        console.error(err);
        status.textContent = 'Ошибка обработки: ' + err.message;
        status.className = 'status error';
      } finally {
        processBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

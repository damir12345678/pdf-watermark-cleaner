<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Удаление водяных знаков PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 520px;
      text-align: center;
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 24px;
    }

    .dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 36px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #f1f5f9;
      margin-bottom: 20px;
    }

    .dropzone.dragover {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .dropzone svg {
      width: 48px;
      height: 48px;
      color: var(--primary);
      margin-bottom: 12px;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s ease;
      display: none;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .status {
      margin-top: 16px;
      font-size: 0.9rem;
      font-weight: 500;
      word-break: break-word;
    }

    .status.success { color: #16a34a; }
    .status.error { color: #dc2626; }
    .status.loading { color: var(--primary); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Удаление водяных знаков PDF</h1>
    <p>Очистка фоновых водяных знаков из отчетов HVPQ</p>

    <div class="dropzone" id="dropzone">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
      </svg>
      <div id="dropzone-text"><strong>Выберите файл</strong> или перетащите его сюда</div>
      <input type="file" id="fileInput" accept="application/pdf">
    </div>

    <button id="processBtn" class="btn">Очистить и скачать</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const status = document.getElementById('status');
    const dropzoneText = document.getElementById('dropzone-text');

    let selectedFile = null;

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) handleFileSelection(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFileSelection(e.target.files[0]);
    });

    function handleFileSelection(file) {
      if (!file.name.toLowerCase().endsWith('.pdf')) {
        status.textContent = 'Пожалуйста, выберите PDF-файл.';
        status.className = 'status error';
        return;
      }
      selectedFile = file;
      dropzoneText.innerHTML = `Выбран файл: <strong>${file.name}</strong>`;
      processBtn.style.display = 'block';
      status.textContent = '';
    }

    function cleanContentStreams(contentsRef, deletedImageNames, context) {
      if (!contentsRef || deletedImageNames.length === 0) return;

      const contentsObj = context.lookup(contentsRef);
      const streams = (contentsObj instanceof PDFLib.PDFArray) 
        ? contentsObj.asArray() 
        : [contentsRef];

      for (let i = 0; i < streams.length; i++) {
        const stream = context.lookup(streams[i]);
        if (!(stream instanceof PDFLib.PDFStream)) continue;
        
        let raw = "";
        try {
          const decompressed = pako.inflate(stream.getContents());
          raw = new TextDecoder('latin1').decode(decompressed);
        } catch(e) {
          raw = new TextDecoder('latin1').decode(stream.getContents());
        }

        let modified = raw;
        for (const imgName of deletedImageNames) {
          const regex = new RegExp(`\\/${imgName}\\s+Do`, 'g');
          modified = modified.replace(regex, '');
        }

        if (modified !== raw) {
          const encoded = new TextEncoder().encode(modified);
          const compressed = pako.deflate(encoded);
          
          // Создаем чистый новый поток и подменяем его в контексте
          const newStream = context.flateStream(compressed);
          if (contentsObj instanceof PDFLib.PDFArray) {
            contentsObj.set(i, newStream);
          } else {
            return newStream;
          }
        }
      }
      return null;
    }

    processBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      status.textContent = 'Удаление водяных знаков...';
      status.className = 'status loading';
      processBtn.disabled = true;

      try {
        const fileBuffer = await selectedFile.arrayBuffer();
        const pdfDoc = await PDFLib.PDFDocument.load(fileBuffer);
        const pages = pdfDoc.getPages();
        const context = pdfDoc.context;

        for (let i = 0; i < pages.length; i++) {
          const page = pages[i];
          const { node } = page;
          const resourcesRef = node.get(PDFLib.PDFName.of('Resources'));
          const resources = resourcesRef ? context.lookup(resourcesRef) : null;
          if (!resources || !(resources instanceof PDFLib.PDFDict)) continue;

          const xObjectRef = resources.get(PDFLib.PDFName.of('XObject'));
          const xObject = xObjectRef ? context.lookup(xObjectRef) : null;
          const deletedImages = [];

          if (xObject && xObject instanceof PDFLib.PDFDict) {
            const keys = xObject.keys();
            for (const key of keys) {
              const objRef = xObject.get(key);
              const obj = context.lookup(objRef);

              if (obj instanceof PDFLib.PDFStream) {
                const subtype = obj.dict.get(PDFLib.PDFName.of('Subtype'));
                
                if (subtype && subtype.toString() === '/Image') {
                  const width = obj.dict.get(PDFLib.PDFName.of('Width'))?.value;
                  const height = obj.dict.get(PDFLib.PDFName.of('Height'))?.value;

                  // Сохраняем логотип OCIMF на 1-й странице (он крупный в шапке)
                  const isLogoOnFirstPage = (i === 0 && width > 400 && height < 250);

                  if (!isLogoOnFirstPage) {
                    deletedImages.push(key.toString().replace('/', ''));
                    xObject.delete(key);
                  }
                }
              }
            }
          }

          // Очищаем команды Do из Contents
          const contentsRef = node.get(PDFLib.PDFName.of('Contents'));
          if (contentsRef) {
            const newSingleStream = cleanContentStreams(contentsRef, deletedImages, context);
            if (newSingleStream) {
              node.set(PDFLib.PDFName.of('Contents'), newSingleStream);
            }
          }
        }

        const modifiedBytes = await pdfDoc.save();
        const blob = new Blob([modifiedBytes], { type: 'application/pdf' });
        const downloadUrl = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = selectedFile.name.replace('.pdf', '_cleaned.pdf');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);

        status.textContent = 'Готово! Водяные знаки удалены, файл скачан.';
        status.className = 'status success';
      } catch (err) {
        console.error(err);
        status.textContent = 'Ошибка: ' + err.message;
        status.className = 'status error';
      } finally {
        processBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

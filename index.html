<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Удаление водяных знаков PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 520px;
      text-align: center;
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 24px;
    }

    .dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 36px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #f1f5f9;
      margin-bottom: 20px;
    }

    .dropzone.dragover {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .dropzone svg {
      width: 48px;
      height: 48px;
      color: var(--primary);
      margin-bottom: 12px;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s ease;
      display: none;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .status {
      margin-top: 16px;
      font-size: 0.9rem;
      font-weight: 500;
      word-break: break-word;
    }

    .status.success { color: #16a34a; }
    .status.error { color: #dc2626; }
    .status.loading { color: var(--primary); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Удаление графических водяных знаков</h1>
    <p>Полная очистка фоновых изображений и меток отчета HVPQ</p>

    <div class="dropzone" id="dropzone">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
      </svg>
      <div id="dropzone-text"><strong>Выберите файл</strong> или перетащите его сюда</div>
      <input type="file" id="fileInput" accept="application/pdf">
    </div>

    <button id="processBtn" class="btn">Очистить и скачать</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const status = document.getElementById('status');
    const dropzoneText = document.getElementById('dropzone-text');

    let selectedFile = null;

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) handleFileSelection(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFileSelection(e.target.files[0]);
    });

    function handleFileSelection(file) {
      if (!file.name.toLowerCase().endsWith('.pdf')) {
        status.textContent = 'Пожалуйста, выберите PDF-файл.';
        status.className = 'status error';
        return;
      }
      selectedFile = file;
      dropzoneText.innerHTML = `Выбран файл: <strong>${file.name}</strong>`;
      processBtn.style.display = 'block';
      status.textContent = '';
    }

    function cleanContentStreams(contentsObj, deletedImageNames) {
      if (!contentsObj || deletedImageNames.length === 0) return;

      const streams = contentsObj instanceof PDFLib.PDFArray 
        ? contentsObj.asArray() 
        : [contentsObj];

      for (const stream of streams) {
        if (!(stream instanceof PDFLib.PDFStream)) continue;
        
        let raw = "";
        try {
          const decompressed = pako.inflate(stream.getContents());
          raw = new TextDecoder('latin1').decode(decompressed);
        } catch(e) {
          raw = new TextDecoder('latin1').decode(stream.getContents());
        }

        // Вырезаем операторы вызова удалённых картинок (например: "/Im0 Do" или "/X0 Do")
        for (const imgName of deletedImageNames) {
          const regex = new RegExp(`\\/${imgName}\\s+Do`, 'g');
          raw = raw.replace(regex, '');
        }

        const encoded = new TextEncoder().encode(raw);
        stream.setContents(pako.deflate(encoded));
        stream.dict.set(PDFLib.PDFName.of('Filter'), PDFLib.PDFName.of('FlateDecode'));
      }
    }

    processBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      status.textContent = 'Удаление водяных изображений из 74 страниц...';
      status.className = 'status loading';
      processBtn.disabled = true;

      try {
        const fileBuffer = await selectedFile.arrayBuffer();
        const pdfDoc = await PDFLib.PDFDocument.load(fileBuffer);
        const pages = pdfDoc.getPages();

        for (let i = 0; i < pages.length; i++) {
          const page = pages[i];
          const { node } = page;
          const resources = node.Resources();
          if (!resources) continue;

          const xObject = resources.lookup(PDFLib.PDFName.of('XObject'));
          const deletedImages = [];

          if (xObject && xObject instanceof PDFLib.PDFDict) {
            const keys = xObject.keys();
            for (const key of keys) {
              const obj = xObject.lookup(key);
              if (obj instanceof PDFLib.PDFStream) {
                const subtype = obj.dict.lookup(PDFLib.PDFName.of('Subtype'));
                
                if (subtype && subtype.asString() === '/Image') {
                  const width = obj.dict.lookup(PDFLib.PDFName.of('Width'))?.value;
                  const height = obj.dict.lookup(PDFLib.PDFName.of('Height'))?.value;
                  const sMask = obj.dict.lookup(PDFLib.PDFName.of('SMask'));
                  const mask = obj.dict.lookup(PDFLib.PDFName.of('Mask'));

                  // Критерии фильтрации:
                  // 1. Наличие маски прозрачности (SMask/Mask)
                  // 2. Или изображение повторяется на всех страницах (на 2-й и далее странице нет логотипа OCIMF)
                  const isLogoOnFirstPage = (i === 0 && width > 400 && height < 250); // сохраняем верхний логотип OCIMF

                  if (!isLogoOnFirstPage) {
                    // Удаляем водяной знак
                    deletedImages.push(key.asString().replace('/', ''));
                    xObject.delete(key);
                  }
                }
              }
            }
          }

          // Очищаем вызов удаленных картинок из самого потока страницы
          const contents = node.lookup(PDFLib.PDFName.of('Contents'));
          cleanContentStreams(contents, deletedImages);
        }

        const modifiedBytes = await pdfDoc.save();
        const blob = new Blob([modifiedBytes], { type: 'application/pdf' });
        const downloadUrl = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = selectedFile.name.replace('.pdf', '_cleaned.pdf');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);

        status.textContent = 'Готово! Фоновые изображения удалены, файл скачан.';
        status.className = 'status success';
      } catch (err) {
        console.error(err);
        status.textContent = 'Ошибка: ' + err.message;
        status.className = 'status error';
      } finally {
        processBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
